---
- name: Set up Eoracle node
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [eoracle]
  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup Pre Tasks
      when: type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run eoracle role
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include eoracle role
          ansible.builtin.include_role:
            name: eoracle
            public: true

  post_tasks:
    - name: Verify eoracle node
      when: type in allowed_node_types
      block:
        # No version check: the image is pinned to a moving tag (latest), not a version
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ eoracle_log_file_path }}"
            health_url: "http://localhost:{{ eigenlayer.eoracle.ports.prometheus_port }}/metrics"
