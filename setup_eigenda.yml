---
- name: Set up EigenDA node
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [eigenda]
  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup Pre Tasks
      when: type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run eigenda role
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include eigenda role
          ansible.builtin.include_role:
            name: eigenda
            public: true

  post_tasks:
    - name: Verify eigenda node
      when: type in allowed_node_types
      block:
        # No version check: the node binary blocks forever after printing --version
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ eigenda_log_file_path }}"
            health_url: "http://localhost:{{ eigenlayer.eigenda.ports.node_api_port }}/eigen/node/health"
            health_status_codes: [200, 206]
            # the API opens after the node loads NODE_SRS_LOAD (8388608) SRS points with one worker
            health_retries: 60
